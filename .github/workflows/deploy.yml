name: iOS Release

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Gems
        run: bundle install

      #########################################################
      # Decode Distribution Certificate
      #########################################################

      - name: Decode Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

      #########################################################
      # Decode Provisioning Profile
      #########################################################

      - name: Decode Provision Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

      #########################################################
      # Create Keychain
      #########################################################

      - name: Create Keychain
        env:
          #P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          P12_PASSWORD: "" # If your certificate has no password, leave it empty
        run: |

          security create-keychain -p "" build.keychain

          security default-keychain -s build.keychain

          security unlock-keychain -p "" build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            build.keychain

      #########################################################
      # Install Provision Profile
      #########################################################

      - name: Install Provisioning Profile
        run: |

          UUID=$(/usr/libexec/PlistBuddy \
          -c "Print UUID" \
          /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")

          cp profile.mobileprovision \
          ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      #########################################################
      # Fastlane
      #########################################################

      - name: Build
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: bundle exec fastlane release
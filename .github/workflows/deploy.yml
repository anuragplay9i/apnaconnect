name: iOS Release

on:
  push:
    branches:
      - master
      - main     # Triggers on push to master or main branch
  workflow_dispatch:  # Enables manual trigger from GitHub Actions tab

jobs:
  build_and_deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true  # Disable bundler caching to avoid potential issues with native extensions

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Dependencies
        run: bundle install

      # --------------------------------------------------
      # Decode Distribution Certificate
      # --------------------------------------------------

      - name: Decode Distribution Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          echo "Certificate file created:"
          ls -lh certificate.p12


      - name: Verify decoded P12
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "Testing decoded P12..."

          openssl pkcs12 \
            -in certificate.p12 \
            -passin "pass:$P12_PASSWORD" \
            -noout

          echo "P12 verification successful."


      # --------------------------------------------------
      # Decode Provisioning Profile
      # --------------------------------------------------

      - name: Decode Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          echo "Provisioning profile created:"
          ls -lh profile.mobileprovision


      # --------------------------------------------------
      # Create temporary CI keychain
      # --------------------------------------------------
      - name: Create Signing Keychain
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "Creating keychain..."

          security create-keychain \
            -p "" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Importing certificate..."

          security import "$GITHUB_WORKSPACE/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -f pkcs12 \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo "Setting key partition list..."

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "" \
            "$KEYCHAIN_PATH"

          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      # --------------------------------------------------
      # Install provisioning profile
      # --------------------------------------------------

      - name: Install Provisioning Profile
        run: |

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i profile.mobileprovision \
            > profile.plist

          UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            profile.plist)

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" \
            profile.plist)

          APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            profile.plist)

          echo "Profile UUID: $UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Application Identifier: $APP_ID"

          cp profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"


      # --------------------------------------------------
      # Verify signing environment
      # --------------------------------------------------

      - name: Verify Signing Environment
        run: |

          echo "Installed provisioning profiles:"
          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Available signing identities:"
          security find-identity \
            -v \
            -p codesigning

          echo ""
          echo "Xcode:"
          xcodebuild -version


      - name: Inspect Installed Provisioning Profiles
        run: |
          echo "=== Installed profiles ==="

          for profile in \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          do
            echo ""
            echo "FILE: $profile"

            security cms -D -i "$profile" > /tmp/profile.plist

            echo "Name:"
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              /tmp/profile.plist

            echo "UUID:"
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              /tmp/profile.plist

            echo "Team:"
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              /tmp/profile.plist

            echo "Application Identifier:"
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              /tmp/profile.plist

            echo "Expiration:"
            /usr/libexec/PlistBuddy \
              -c "Print :ExpirationDate" \
              /tmp/profile.plist
          done


      # --------------------------------------------------
      # Build and Upload
      # --------------------------------------------------

      - name: Build and Upload
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          bundle exec fastlane release